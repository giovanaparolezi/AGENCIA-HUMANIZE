<!DOCTYPE html>
<html lang="pt-BR" >
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Agência Humanize</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@700&display=swap');

    body {
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: "Inter", sans-serif;
      background: #fff5ec;

      /* Fundo com blur intenso na parte inferior */
      background:
        radial-gradient(
          circle at center bottom,
          rgba(255, 120, 70, 0.75),
          rgba(255, 100, 50, 0.55) 40%,
          transparent 70%
        );

      opacity: 0;
      animation: pageFadeIn 1s ease forwards;
    }

    @keyframes pageFadeIn {
      to { opacity: 1; }
    }

    .card {
      position: relative;
      text-align: center;
      transform-style: preserve-3d;
      transition: transform 0.2s ease;
      padding: 20px 100px;
      user-select: none;
      opacity: 0;
      animation: cardFadeIn 1s ease 1s forwards; /* delay para o fade da página */
    }

    @keyframes cardFadeIn {
      to { opacity: 1; }
    }

    .line {
      width: 140px;
      height: 3px;
      background: #ff5b5b;
      margin: 0 auto 30px auto;
      border-radius: 20px;
      transform: translateZ(30px);
      transition: transform 0.2s ease;
    }

    .title {
      font-size: 64px;
      font-weight: 700;
      color: #111;
      line-height: 1.1;
      opacity: 1;
      transform: translateZ(60px) translateY(0);
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .icon {
      width: 60px;
      position: absolute;
      transition: transform 0.3s ease;
      filter: drop-shadow(0px 3px 3px rgba(0, 0, 0, 0.15));
      will-change: transform;
    }

    .icon.left {
      left: -95px;
      top: 58%;
      animation: floatLeft 4s ease-in-out infinite;
    }

    .icon.right {
      right: -85px;
      top: 40%;
      animation: floatRight 4.5s ease-in-out infinite;
    }

    @keyframes floatLeft {
      0%, 100% {
        transform: translateZ(50px) translateX(0) translateY(0);
      }
      50% {
        transform: translateZ(50px) translateX(5px) translateY(5px);
      }
    }

    @keyframes floatRight {
      0%, 100% {
        transform: translateZ(50px) translateX(0) translateY(0);
      }
      50% {
        transform: translateZ(50px) translateX(-5px) translateY(-5px);
      }
    }
  </style>
</head>
<body>
  <div class="card" id="card">
    <div class="line"></div>

    <img
      src="COLOQUE A URL DA SUA PRIMEIRA IMAGEM AQUI"
      class="icon left"
      id="iconLeft"
      alt="ícone esquerdo"
    />
    <img
      src="COLOQUE A URL DA SUA SEGUNDA IMAGEM AQUI"
      class="icon right"
      id="iconRight"
      alt="ícone direito"
    />

    <div class="title" id="text">Agência Humanize</div>
  </div>

  <script>
    const frases = [
      "Agência Humanize",
      "Humanização Digital",
      "Marketing com Propósito",
      "Conteúdo que Conecta",
    ];

    const textElement = document.getElementById("text");
    let index = 0;

    /* Função para troca de texto com fade suave */
    function trocarTexto() {
      // Fade out
      textElement.style.opacity = 0;
      textElement.style.transform = "translateZ(60px) translateY(10px)";
      
      setTimeout(() => {
        index = (index + 1) % frases.length;
        textElement.textContent = frases[index];
        
        // Fade in
        textElement.style.opacity = 1;
        textElement.style.transform = "translateZ(60px) translateY(0)";
      }, 700);
    }

    setInterval(trocarTexto, 4000);

    const card = document.getElementById("card");
    const iconLeft = document.getElementById("iconLeft");
    const iconRight = document.getElementById("iconRight");

    card.addEventListener("mousemove", (e) => {
      const rect = card.getBoundingClientRect();
      const x = e.clientX - rect.left - rect.width / 2;
      const y = e.clientY - rect.top - rect.height / 2;

      const rotateX = (y / 40) * -1;
      const rotateY = x / 40;

      card.style.transform = `rotateX(${rotateX}deg) rotateY(${rotateY}deg)`;

      iconLeft.style.transform = `translateZ(50px) translateX(${x / 80}px) translateY(${y / 80}px)`;
      iconRight.style.transform = `translateZ(50px) translateX(${x / 80}px) translateY(${y / 80}px)`;

      textElement.style.transform = `translateZ(60px) translateX(${x / 100}px) translateY(${y / 100}px)`;
    });

    card.addEventListener("mouseleave", () => {
      card.style.transform = "rotateX(0) rotateY(0)";
      textElement.style.transform = "translateZ(60px) translateY(0)";
      iconLeft.style.transform = "translateZ(50px)";
      iconRight.style.transform = "translateZ(50px)";
    });
  </script>
</body>
</html>
